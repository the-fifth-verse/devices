<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>The Fifth Verse Redirect</title>

  <!-- Immediately run a tiny script before anything is rendered -->
  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera;

      // iOS (iPhone/iPad/iPod) ➜ App Store
      if (/iPad|iPhone|iPod/.test(ua)) {
        // For iOS, use window.location.href instead of replace to better handle app store redirects
        window.location.href = "https://apps.apple.com/us/app/the-fifth-verse/id6748741732";
      }
      // Android ➜ Google Play
      else if (/android/i.test(ua)) {
        window.location.replace("https://play.google.com/store/apps/details?id=com.thefifthverse.app");
      }
      // Desktop/Everything else ➜ download page
      else {
        window.location.replace("https://www.thefifthverse.com/download");
      }
    })();
  </script>
</head>
<body>
  <!-- Add a fallback message for iOS users in case JavaScript takes time to load -->
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://www.thefifthverse.com/download">
  </noscript>
</body>
</html>
